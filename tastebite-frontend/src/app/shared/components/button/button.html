<button
  [class]="
    variant() === 'primary'
      ? 'rounded-xl bg-red-600 px-6 py-3 font-semibold text-white transition-all duration-300 hover:bg-red-700'
      : 'rounded-xl border border-red-600 px-6 py-3 font-semibold text-red-600 transition-all duration-300 hover:bg-red-600 hover:text-white'
  "
>
  <ng-content />
</button>
