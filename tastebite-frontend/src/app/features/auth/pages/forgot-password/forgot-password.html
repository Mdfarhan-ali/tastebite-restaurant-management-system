<div class="min-h-screen bg-background">

  <!-- Centered Forgot Password Form -->

  <div class="flex min-h-screen items-center justify-center px-6 py-12">

    <div class="w-full max-w-md rounded-[20px] bg-white p-10 shadow-xl">

      <!-- Heading -->

      <h2 class="text-4xl font-bold">
        Forgot Password 🔑
      </h2>

      <p class="mt-3 text-text-light">
        Enter your registered email to reset your password.
      </p>

      <form
        [formGroup]="forgotForm"
        (ngSubmit)="onSubmit()"
        class="mt-10 space-y-6">

        <!-- Email -->

        <div>

          <label class="mb-2 block font-medium">
            Email
          </label>

          <input
            type="email"
            formControlName="email"
            placeholder="Enter your registered email"
            class="w-full rounded-[14px] border border-gray-300 px-4 py-3 outline-none transition focus:border-primary">

          @if (
            forgotForm.controls.email.touched &&
            forgotForm.controls.email.invalid
          ) {

            <p class="mt-2 text-sm text-red-500">
              Please enter a valid email.
            </p>

          }

        </div>

        <!-- Send Button -->

        <button
          type="submit"
          [disabled]="loading()"
          class="w-full rounded-[14px] bg-primary py-3 font-semibold text-white transition hover:bg-primary-hover disabled:cursor-not-allowed disabled:opacity-60">

          @if (loading()) {

            Sending...

          } @else {

            Send Reset Link

          }

        </button>

        <!-- Back to Login -->

        <p class="text-center">

          Remember your password?

          <a
            routerLink="/auth/login"
            class="font-semibold text-primary hover:underline">

            Login

          </a>

        </p>

      </form>

    </div>

  </div>

</div>
